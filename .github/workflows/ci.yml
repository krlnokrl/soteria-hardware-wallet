name: CI

on:
  push:
  pull_request:

jobs:
  firmware:
    name: Firmware build + host tests (PlatformIO)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('software/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware (all boards)
        run: pio run
      - name: Host tests (addresses, signatures, PSBT, FIDO2)
        run: pio test -e native

  web-client:
    name: Web client tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software/web-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: software/web-client/package-lock.json
      - run: npm ci
      - run: npm test
