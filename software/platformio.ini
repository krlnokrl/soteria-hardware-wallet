; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` builds the boards; host tests run with `pio test -e native`
default_envs = adafruit_feather_m0, mzeroproUSB

[env:adafruit_feather_m0]
platform = atmelsam
board = adafruit_feather_m0
framework = arduino
build_flags = -DSOTERIA_HAS_PLUGGABLE_USB
lib_deps =
	stepansnigirev/uBitcoin@^0.2.0
	adafruit/Adafruit SSD1306@^2.5.15
	kmackay/micro-ecc@^1.0.0
	ricmoo/QRCode@^0.0.1
	bblanchon/ArduinoJson@^7.2.1
; tests run on the host (env:native), not on the board
test_ignore = *

[env:mzeroproUSB]
platform = atmelsam
board = mzeroproUSB
framework = arduino
lib_deps =
	adafruit/Adafruit SSD1306@^2.5.15
	kmackay/micro-ecc@^1.0.0
	ricmoo/QRCode@^0.0.1
	stepansnigirev/uBitcoin@^0.2.0
	bblanchon/ArduinoJson@^7.2.1
test_ignore = *

; Host (PC / CI) unit tests: the hardware-independent firmware code (crypto,
; Bitcoin/Ethereum signing, FIDO2) against Arduino/USB/I2C stand-ins in
; test/libs/HostStubs. Needs a host gcc/g++.
[env:native]
platform = native
test_build_src = yes
build_src_filter = +<crypto/> +<u2f.cpp> +<buttons.cpp> +<utils.cpp> +<SecureStorage.cpp>
build_flags = -std=gnu++14 -DUSE_STDONLY -DSOTERIA_HAS_PLUGGABLE_USB -Isrc
lib_extra_dirs = test/libs
; uBitcoin / micro-ecc are plain C/C++ but declare Arduino metadata
lib_compat_mode = off
lib_deps =
	stepansnigirev/uBitcoin@^0.2.0
	kmackay/micro-ecc@^1.0.0
