; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` builds the boards; host tests run with `pio test -e native`
default_envs = adafruit_feather_m0, mzeroproUSB

; Uploads: the wallet firmware ignores the 1200-baud "touch" (src/main.cpp),
; only a double tap of the reset button starts the bootloader. Double-tap,
; then: pio run -e <env> -t upload --upload-port <bootloader port>
[env:adafruit_feather_m0]
platform = atmelsam
board = adafruit_feather_m0
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no
framework = arduino
build_src_filter = +<*> -<rngtest/> -<setest/> -<seprov/>
build_flags = -DSOTERIA_HAS_PLUGGABLE_USB
lib_deps =
	stepansnigirev/uBitcoin@^0.2.0
	adafruit/Adafruit SSD1306@^2.5.15
	kmackay/micro-ecc@^1.0.0
	ricmoo/QRCode@^0.0.1
	bblanchon/ArduinoJson@^7.2.1
; tests run on the host (env:native), not on the board
test_ignore = *

[env:mzeroproUSB]
platform = atmelsam
board = mzeroproUSB
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no
framework = arduino
build_src_filter = +<*> -<rngtest/> -<setest/> -<seprov/>
lib_deps =
	adafruit/Adafruit SSD1306@^2.5.15
	kmackay/micro-ecc@^1.0.0
	ricmoo/QRCode@^0.0.1
	stepansnigirev/uBitcoin@^0.2.0
	bblanchon/ArduinoJson@^7.2.1
test_ignore = *

; RNG test firmware (src/rngtest/, built instead of main.cpp): grades the
; entropy, bias and speed of RNGpin() on the board and reports on USB serial.
;   pio run -e rngtest_feather_m0 -t upload && pio device monitor -e rngtest_feather_m0
; Not in default_envs; flash the wallet env again afterwards.
[env:rngtest_feather_m0]
extends = env:adafruit_feather_m0
build_src_filter = +<*> -<main.cpp> -<setest/> -<seprov/>
monitor_speed = 115200

[env:rngtest_mzeroproUSB]
extends = env:mzeroproUSB
build_src_filter = +<*> -<main.cpp> -<setest/> -<seprov/>
monitor_speed = 115200

; Secure element probe firmware (src/setest/, built instead of main.cpp):
; talks to the ATECC508A read-only - wake, Info, config zone dump, slot
; map compared with the plan (docs/ATECC_PLAN.md), bus stress test with
; the OLED. Never writes or locks the chip.
;   pio run -e setest_feather_m0 -t upload && pio device monitor -e setest_feather_m0
; Not in default_envs; flash the wallet env again afterwards.
[env:setest_feather_m0]
extends = env:adafruit_feather_m0
build_src_filter = +<*> -<main.cpp> -<rngtest/> -<seprov/>
monitor_speed = 115200

[env:setest_mzeroproUSB]
extends = env:mzeroproUSB
build_src_filter = +<*> -<main.cpp> -<rngtest/> -<seprov/>
monitor_speed = 115200

; Secure element provisioning firmware (src/seprov/, built instead of
; main.cpp): writes the planned slot map, LOCKS the ATECC508A (irreversible,
; needs typed confirmations) and verifies the slot rules. See
; docs/ATECC_PLAN.md. Not in default_envs; flash the wallet env afterwards.
[env:seprov_feather_m0]
extends = env:adafruit_feather_m0
build_src_filter = +<*> -<main.cpp> -<rngtest/> -<setest/>
monitor_speed = 115200

[env:seprov_mzeroproUSB]
extends = env:mzeroproUSB
build_src_filter = +<*> -<main.cpp> -<rngtest/> -<setest/>
monitor_speed = 115200

; Host (PC / CI) unit tests: the hardware-independent firmware code (crypto,
; Bitcoin/Ethereum signing, FIDO2) against Arduino/USB/I2C stand-ins in
; test/libs/HostStubs. Needs a host gcc/g++.
[env:native]
platform = native
test_build_src = yes
build_src_filter = +<crypto/> +<se/> +<u2f.cpp> +<buttons.cpp> +<utils.cpp> +<SecureStorage.cpp>
build_flags = -std=gnu++14 -DUSE_STDONLY -DSOTERIA_HAS_PLUGGABLE_USB -Isrc
lib_extra_dirs = test/libs
; uBitcoin / micro-ecc are plain C/C++ but declare Arduino metadata
lib_compat_mode = off
lib_deps =
	stepansnigirev/uBitcoin@^0.2.0
	kmackay/micro-ecc@^1.0.0
